\n    <div class=\"card\">\n      <div class=\"phase-header\">\n        <p class=\"phase-meta\">Week 01<\u002Fp>\n        <h2 class=\"phase-title\">第一周<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-due\">截止作业<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items due\">\n          <li>学术诚信承诺书<\u002Fli>\n          <li>课程大纲测验<\u002Fli>\n          <li>讨论:打个招呼吧<\u002Fli>\n          <li>课程入门导航（完成确认码提交，必做、不计分）<\u002Fli>\n          <li>防止抄袭知识测验<\u002Fli>\n          <li>单元讨论<\u002Fli>\n          <li>学术文献阅读笔记<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-learn\">学习任务<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items\">\n          <li>先完成第零单元全部四项必做任务，再进入第一单元和研究生项目基础训练测验<\u002Fli>\n          <li>了解各项作业的作业要求,尤其是文献阅读笔记<\u002Fli>\n          <li>观看课程视频,根据自己的时间和需求选择性阅读单元中提供的阅读材料<\u002Fli>\n          <li>学会从期刊官网或 ASU 图书馆数据库中下载学术文献<\u002Fli>\n          <li>查看\"开学初期同学常见问题\"<\u002Fli>\n          <li>查看课程大纲<\u002Fli>\n          <li>查看\"公告\"中的\"Canvas 操作演示\",熟悉 Canvas 学习平台的使用<\u002Fli>\n          <li>参加第一周第一天的线上交流 Zoom 会议<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <!-- ============ PHASE 2 ============ -->\n  <article class=\"phase\">\n    <div class=\"stepper\">\n      <span class=\"step-num\">PHASE 02<\u002Fspan>\n    <\u002Fdiv>\n    <svg class=\"arrow\" viewBox=\"0 0 18 14\" aria-hidden=\"true\">\n      <path d=\"M0 7 L14 7 M9 2 L14 7 L9 12\" stroke=\"#FFC627\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><\u002Fpath>\n    <\u002Fsvg>\n    <div class=\"card\">\n      <div class=\"phase-header\">\n        <p class=\"phase-meta\">Week 02<\u002Fp>\n        <h2 class=\"phase-title\">第二周<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-due\">截止作业<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items due\">\n          <li>单元讨论<\u002Fli>\n          <li>学术文献阅读笔记<\u002Fli>\n          <li>APA 格式参考资源测试<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-learn\">学习任务<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items\">\n          <li>观看课程视频,根据自己的时间和需求选择性阅读单元中提供的阅读材料<\u002Fli>\n          <li>掌握 APA 格式的基本结构,并学会使用 AI 或网络资源自动生成文献的 APA 参考信息<\u002Fli>\n          <li>根据自己的学习兴趣使用图书馆资源搜索学术文献<\u002Fli>\n          <li>阅读自己感兴趣的文献,开始了解学术文献的基本结构<\u002Fli>\n          <li>在力所能及的范围内,尝试讨论第二个讨论题目<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <!-- ============ PHASE 3 ============ -->\n  <article class=\"phase\">\n    <div class=\"stepper\">\n      <span class=\"step-num\">PHASE 03<\u002Fspan>\n    <\u002Fdiv>\n    <svg class=\"arrow\" viewBox=\"0 0 18 14\" aria-hidden=\"true\">\n      <path d=\"M0 7 L14 7 M9 2 L14 7 L9 12\" stroke=\"#FFC627\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><\u002Fpath>\n    <\u002Fsvg>\n    <div class=\"card\">\n      <div class=\"phase-header\">\n        <p class=\"phase-meta\">Week 03<\u002Fp>\n        <h2 class=\"phase-title\">第三周<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-due\">截止作业<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items due\">\n          <li>单元讨论<\u002Fli>\n          <li>学术文献阅读笔记<\u002Fli>\n          <li>心理学学术文献与搜索测验<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-learn\">学习任务<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items\">\n          <li>对心理学学术文献与日常阅读材料的区别有一个整体上的认识<\u002Fli>\n          <li>熟练通过数据库下载学术文献全文<\u002Fli>\n          <li>开始练习\"阅读 → 提取关键词 → 搜索 → 阅读 → 提取新关键词 → 搜索\"的循环,找到自己感兴趣的研究文献<\u002Fli>\n          <li>通过周末答疑与任课教师和同学沟通<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <!-- ============ PHASE 4 (Weeks 4–6) ============ -->\n  <article class=\"phase wide\">\n    <div class=\"stepper\">\n      <span class=\"step-num\">PHASE 04<\u002Fspan>\n    <\u002Fdiv>\n    <svg class=\"arrow\" viewBox=\"0 0 18 14\" aria-hidden=\"true\">\n      <path d=\"M0 7 L14 7 M9 2 L14 7 L9 12\" stroke=\"#FFC627\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"square\" stroke-linejoin=\"miter\"><\u002Fpath>\n    <\u002Fsvg>\n    <div class=\"card\">\n      <div class=\"phase-header\">\n        <p class=\"phase-meta\">Weeks 04 – 06 · 三周阶段<\u002Fp>\n        <h2 class=\"phase-title\">第四周至第六周<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-due\">截止作业<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items due\">\n          <li>单元讨论<\u002Fli>\n          <li>学术文献阅读笔记<\u002Fli>\n          <li>完成剩余所有研究生能力基础训练测验<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-learn\">学习任务<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items\">\n          <li>学会如何完成高质量的讨论,语言开始学术化,熟练使用 APA 格式进行讨论写作<\u002Fli>\n          <li>学会用 AI 辅助精读和略读<\u002Fli>\n          <li>习惯通过阅读更多的学术文献来积累相关领域的专业知识<\u002Fli>\n          <li>适应网络学习的模式,习惯通过邮件与任课教师交流<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n  <!-- ============ PHASE 5 ============ -->\n  <article class=\"phase\">\n    <div class=\"stepper\">\n      <span class=\"step-num\">PHASE 05<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"phase-header\">\n        <p class=\"phase-meta\">Week 07 · 总结<\u002Fp>\n        <h2 class=\"phase-title\">第七周<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-due\">截止作业<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items due\">\n          <li>期末考试<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"section\">\n        <div class=\"section-head\">\n          <span class=\"tag tag-learn\">学习任务<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"items\">\n          <li>温故而知新<\u002Fli>\n          <li>总结自己一个学期的学习,确认自己的学习目标和专业研究兴趣领域<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>\n\n<\u002Fmain>\n\n<footer class=\"site-footer\">\n  Arizona State University <span>·<\u002Fspan> School of Social and Behavioral Sciences <span>·<\u002Fspan> AZX Online M.S. in Psychology <span>·<\u002Fspan> Summer Semester\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
